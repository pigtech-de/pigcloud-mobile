<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PigCloud</title>
    <style>
        body {
            margin: 0;
            padding: 24px;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
            color: #e0e0e0;
            text-align: center;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 1.25rem;
        }
        p {
            margin: 0 0 6px;
            color: #b0b0c0;
        }
        button {
            margin-top: 24px;
            padding: 10px 24px;
            border: 0;
            border-radius: 8px;
            background: #4a4a7a;
            color: #fff;
            font: inherit;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>You're offline</h1>
    <p>PigCloud could not be reached. Check your connection and try again.</p>
    <p lang="de">Du bist offline. PigCloud ist nicht erreichbar. Prüf deine Verbindung und versuch es nochmal.</p>
    <button type="button" id="retry">Retry</button>
    <script>
        document.getElementById('retry').addEventListener('click', function () {
            window.location.href = 'https://pigcloud.de/cloud/';
        });
    </script>
</body>
</html>
